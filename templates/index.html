<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discogs Auto ID</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Discogs Auto ID</h1>

        <div id="credentials-container">
            <div class="folder-container">
                <label for="discogs-token">Discogs Token:</label>
                <input type="text" id="discogs-token" placeholder="Enter your Discogs token">
                <a href="https://www.discogs.com/settings/developers">Token</a>
            </div>
            <div class="folder-container">
                <label for="discogs-country">Discogs Country:</label>
                <input type="text" id="discogs-country" placeholder="e.g., US, UK, DE" value="US">
            </div>
            <button id="set-credentials-button">Set Credentials</button>
        </div>

        <div id="main-app" style="display: none;">
            <div class="folder-container">
                <label for="folder-name">Discogs Folder Name:</label>
                <input type="text" id="folder-name" placeholder="Enter folder name">
                <button id="set-folder-button">Set Folder</button>
            </div>

            <div class="slot-container">
                <label>Slot Counter:</label>
                <span id="slot-counter">0</span>
                <button id="decrement-slot">-</button>
                <button id="increment-slot">+</button>
            </div>

            <div id="status">Ready</div>

            <button id="start-identification-button" disabled>Start Identification</button>

            <div id="manual-search-container" class="manual-search-box" style="display: none;">
                <h3>Manual Search</h3>
                <div class="manual-search-inputs">
                    <div class="manual-search-field">
                        <label for="manual-title">Title:</label>
                        <input type="text" id="manual-title">
                    </div>
                    <div class="manual-search-field">
                        <label for="manual-artist">Artist:</label>
                        <input type="text" id="manual-artist">
                    </div>
                </div>
                <button id="manual-search-button">Search</button>
            </div>

            <div class="results-container">
                <h2>Search Results</h2>
                <ul id="results-list"></ul>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
